<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Setup — Portfolio</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="auth-page">
    <div class="auth-box" role="main">
      <div class="auth-box__header">
        <div class="auth-box__icon">
          <i class="fas fa-shield-alt" aria-hidden="true"></i>
        </div>
        <h1 class="auth-box__title">First-Time Setup</h1>
        <p class="auth-box__subtitle">Create your admin credentials to get started</p>
      </div>

      <div class="setup-info">
        <p><strong>Welcome!</strong> This page only appears once. Set a strong username and password for your admin panel.</p>
        <p>Your credentials will be stored securely using SHA-256 hashing with a unique salt.</p>
      </div>

      <div class="auth-error" id="setup-error" role="alert">
        <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
        <span id="setup-error-text"></span>
      </div>

      <form id="setup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="setup-username">Username</label>
          <div class="input-wrapper">
            <i class="input-wrapper__icon fas fa-user" aria-hidden="true"></i>
            <input
              class="form-input"
              type="text"
              id="setup-username"
              name="username"
              placeholder="Choose a username"
              autocomplete="username"
              required
              minlength="3"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="setup-password">Password</label>
          <div class="input-wrapper">
            <i class="input-wrapper__icon fas fa-lock" aria-hidden="true"></i>
            <input
              class="form-input"
              type="password"
              id="setup-password"
              name="password"
              placeholder="Choose a strong password"
              autocomplete="new-password"
              required
              minlength="8"
            >
          </div>
          <!-- Password strength indicator -->
          <div class="password-strength" id="password-strength">
            <div class="password-strength__bar" id="ps-bar-1"></div>
            <div class="password-strength__bar" id="ps-bar-2"></div>
            <div class="password-strength__bar" id="ps-bar-3"></div>
            <span class="password-strength__label" id="ps-label"></span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="setup-confirm">Confirm Password</label>
          <div class="input-wrapper">
            <i class="input-wrapper__icon fas fa-lock" aria-hidden="true"></i>
            <input
              class="form-input"
              type="password"
              id="setup-confirm"
              name="confirm_password"
              placeholder="Repeat your password"
              autocomplete="new-password"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--block btn--lg" id="setup-submit">
          <span id="setup-btn-text"><i class="fas fa-check-circle"></i> Create Admin Account</span>
          <span id="setup-btn-loading" style="display:none;"><span class="spinner"></span> Setting up...</span>
        </button>
      </form>

      <a href="../index.html" class="auth-box__back">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        Back to Portfolio
      </a>
    </div>
  </div>

  <script type="module">
    import { auth } from '../js/auth.js';
    import { hashPassword, generateSalt, measurePasswordStrength } from '../js/crypto.js';
    import { ParticleSystem } from '../js/particles.js';

    // Guard: redirect if credentials already exist.
    // top-level await is valid in type="module" scripts.
    await auth.guardSetup();

    // Particle background
    const canvas = document.getElementById('bg-canvas');
    if (canvas) {
      const ps = new ParticleSystem(canvas, { count: 50 });
      ps.init();
    }

    // Password strength meter
    const passwordInput = document.getElementById('setup-password');
    passwordInput.addEventListener('input', () => {
      const { score, label } = measurePasswordStrength(passwordInput.value);
      const bars = ['ps-bar-1', 'ps-bar-2', 'ps-bar-3'];
      const classMap = ['is-weak', 'is-medium', 'is-strong'];

      bars.forEach((id, i) => {
        const bar = document.getElementById(id);
        bar.className = 'password-strength__bar';
        if (i < score) bar.classList.add(classMap[score - 1]);
      });

      document.getElementById('ps-label').textContent = passwordInput.value ? label : '';
    });

    // Form submit
    const form     = document.getElementById('setup-form');
    const errorEl  = document.getElementById('setup-error');
    const errorTxt = document.getElementById('setup-error-text');
    const btnText  = document.getElementById('setup-btn-text');
    const btnLoad  = document.getElementById('setup-btn-loading');

    function showError(msg) {
      errorTxt.textContent = msg;
      errorEl.classList.add('is-visible');
    }

    function clearError() {
      errorEl.classList.remove('is-visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const username = document.getElementById('setup-username').value.trim();
      const password = document.getElementById('setup-password').value;
      const confirm  = document.getElementById('setup-confirm').value;

      // Validation
      if (username.length < 3) {
        showError('Username must be at least 3 characters.');
        return;
      }

      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }

      if (password !== confirm) {
        showError('Passwords do not match.');
        return;
      }

      // Show loading state
      btnText.style.display = 'none';
      btnLoad.style.display = 'inline-flex';

      try {
        const salt = generateSalt();
        const hash = await hashPassword(password, salt);
        const setupResult = await auth.saveCredentials(username, hash, salt);
        if (!setupResult.success) {
          throw new Error(setupResult.message);
        }

        // Brief success pause then redirect
        await new Promise(r => setTimeout(r, 500));
        window.location.href = 'login.html';
      } catch (err) {
        btnText.style.display = '';
        btnLoad.style.display = 'none';
        showError('Setup failed: ' + err.message);
      }
    });
  </script>

</body>
</html>
