<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Portfolio</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="auth-page">
    <div class="auth-box" role="main">
      <div class="auth-box__header">
        <div class="auth-box__icon">
          <i class="fas fa-shield-alt" aria-hidden="true"></i>
        </div>
        <h1 class="auth-box__title">Admin Panel</h1>
        <p class="auth-box__subtitle">Sign in to manage your portfolio</p>
      </div>

      <div class="auth-error" id="login-error" role="alert">
        <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
        <span id="login-error-text"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <div class="input-wrapper">
            <i class="input-wrapper__icon fas fa-user" aria-hidden="true"></i>
            <input
              class="form-input"
              type="text"
              id="login-username"
              name="username"
              placeholder="Your username"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-wrapper">
            <i class="input-wrapper__icon fas fa-lock" aria-hidden="true"></i>
            <input
              class="form-input"
              type="password"
              id="login-password"
              name="password"
              placeholder="Your password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              id="toggle-password"
              style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-text-muted); cursor:pointer; padding:4px;"
              aria-label="Toggle password visibility"
            >
              <i class="fas fa-eye" id="toggle-icon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--block btn--lg" id="login-submit">
          <span id="login-btn-text"><i class="fas fa-sign-in-alt"></i> Sign In</span>
          <span id="login-btn-loading" style="display:none;"><span class="spinner"></span> Signing in...</span>
        </button>
      </form>

      <a href="../index.html" class="auth-box__back">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        Back to Portfolio
      </a>
    </div>
  </div>

  <script type="module">
    import { auth } from '../js/auth.js';
    import { ParticleSystem } from '../js/particles.js';

    // Guard: redirect to setup if no credentials, or to dashboard if already logged in.
    // top-level await is valid in type="module" scripts.
    await auth.guardLogin();

    // Particle background
    const canvas = document.getElementById('bg-canvas');
    if (canvas) {
      const ps = new ParticleSystem(canvas, { count: 50 });
      ps.init();
    }

    // Toggle password visibility
    const passwordInput = document.getElementById('login-password');
    const toggleBtn     = document.getElementById('toggle-password');
    const toggleIcon    = document.getElementById('toggle-icon');

    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleIcon.className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
    });

    // Form submit
    const form     = document.getElementById('login-form');
    const errorEl  = document.getElementById('login-error');
    const errorTxt = document.getElementById('login-error-text');
    const btnText  = document.getElementById('login-btn-text');
    const btnLoad  = document.getElementById('login-btn-loading');
    const authBox  = document.querySelector('.auth-box');

    function showError(msg) {
      errorTxt.textContent = msg;
      errorEl.classList.add('is-visible');
      // Shake animation
      authBox.style.animation = 'shake 0.5s ease-in-out';
      authBox.addEventListener('animationend', () => {
        authBox.style.animation = '';
      }, { once: true });
    }

    function clearError() {
      errorEl.classList.remove('is-visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      if (!username || !password) {
        showError('Please enter both username and password.');
        return;
      }

      // Show loading state
      btnText.style.display = 'none';
      btnLoad.style.display = 'inline-flex';
      document.getElementById('login-submit').disabled = true;

      try {
        const result = await auth.login(username, password);

        if (result.success) {
          window.location.href = 'dashboard.html';
        } else {
          btnText.style.display = '';
          btnLoad.style.display = 'none';
          document.getElementById('login-submit').disabled = false;
          showError(result.message);
        }
      } catch (err) {
        btnText.style.display = '';
        btnLoad.style.display = 'none';
        document.getElementById('login-submit').disabled = false;
        showError('Login failed. Please try again.');
      }
    });
  </script>

</body>
</html>
